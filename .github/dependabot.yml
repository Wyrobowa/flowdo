version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch only. Majors deliberately fall outside the group so each
      # arrives as its own reviewable PR — a grouped bump of five packages that
      # happened to include three majors is how flowdo's main went red.
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Without this, action versions are never bumped automatically — which is how
  # the whole account drifted onto Node 20 actions unnoticed (WYR-18).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
